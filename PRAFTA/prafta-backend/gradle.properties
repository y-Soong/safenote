# JDK 위치는 머신마다 다르므로 절대경로를 커밋하지 않는다.
# - Gradle 실행 JVM: 환경변수 JAVA_HOME 을 사용한다(미설정 시 PATH 의 java).
# - 컴파일 JDK: build.gradle 의 toolchain(JavaLanguageVersion 21) + 아래 auto-detect 로 자동 탐지.
# 특정 PC에서만 쓰는 JDK 경로가 필요하면 커밋되지 않는 사용자 레벨 파일
#   (~/.gradle/gradle.properties)에 org.gradle.java.home / installations.paths 를 둔다.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

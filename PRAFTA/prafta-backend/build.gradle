plugins {
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.prafta'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
    // PRAFTA-003-8: 한글 인코딩 정렬을 위해 소스 인코딩을 UTF-8 로 명시.
    // 별도 지정이 없으면 Windows 환경에서 플랫폼 기본 인코딩(CP949)을 사용해
    // UTF-8 로 저장된 .java 의 한글이 깨질 수 있다.
    options.encoding = 'UTF-8'
}

// JUnit 5(Jupiter) 테스트 실행 설정 (Spring Boot 3 = JUnit 5). 누락 시 테스트가 "No tests found"로 미실행됨.
tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
    testCompileOnly 'org.projectlombok:lombok:1.18.44'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.44'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // PRAFTA RAG(AI 검색) — pgvector 코퍼스 2차 데이터소스(Postgres) JDBC 드라이버.
    // 읽기전용 벡터 검색 전용. 기존 MySQL/MyBatis 배선과 독립(별도 DataSource + JdbcTemplate).
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    implementation 'p6spy:p6spy:3.9.1'

    implementation 'org.springframework.security:spring-security-crypto'

    // PRAFTA-036 — 사용자 일괄 생성 엑셀(.xlsx) 양식 다운로드/업로드.
    // poi-ooxml 은 poi(core)와 poi-ooxml-lite(스키마 일부) 를 transitively 가져온다.
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // PRAFTA-COM-002 — FCM 공용 PUSH 전송 워커(consumer).
    // Firebase Admin SDK(Java). grpc/guava 등 transitive 의존이 다수 유입되어 첫 빌드시간이 길어질 수 있음.
    // FCM 호출은 FcmClient 래퍼에만 격리한다. 키 부재/게이트 off 시 초기화하지 않아 부팅 영향 0.
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // 저장형 XSS 방어 — 앱 TBM 교육내용(리치 HTML) 서버측 sanitize(Jsoup Safelist).
    // 기존 의존성과 동일하게 명시 버전 고정.
    implementation 'org.jsoup:jsoup:1.18.3'

    // TBM_AI T0 — PDF 첨부(SYS018 04)를 페이지 이미지로 렌더링(VLM 입력). PDFBox 3.x PDFRenderer.
    // fontbox 를 transitive 로 가져온다. 렌더는 FileServiceImpl.loadPdfPageImages 에만 격리.
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'

    // PRAFTA RAG Phase 2(ai01/answer) + 위험성평가 AI 도출 — LLM 공급자 = 네이버 HyperCLOVA X(HCX-005).
    // 별도 SDK 없이 Spring RestClient(spring-boot-starter-web 포함)로 REST 호출한다.
    // 비밀(CLOVA_STUDIO_API_KEY)은 AiLlmConfig 가 OS 환경변수에서 로드(properties/코드 평문 금지).
    // 게이트(prafta.ai.llm.enabled=false) OFF 시 HCX 클라이언트 빈 미생성.
}
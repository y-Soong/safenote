# ===== 로그 위생 — 공유 스냅샷(subcon03) 매퍼 SQL 파라미터 억제 =====
# 공통 application.properties 의 logging.level.com.prafta=DEBUG 가 prod 에도 상속되면
# MyBatis 가 매퍼 로거로 SQL 바인드 파라미터를 찍는다. subcon03 은 승인 1회에 근로자 성명
# 수천 건을 배치 INSERT 파라미터로 흘리는 유일한 경로라, 로그 파일이 사실상 근로자 명부
# 사본이 된다(성명 평문 저장의 보호막이 '접근통제'인데 로그는 그 밖에 있다).
# → 본 패키지만 INFO 로 격상해 대량 PII 유출면을 닫는다.
#   ※ com.prafta 전역 DEBUG 자체의 prod 적정성은 별도 검토 대상(다른 매퍼도 파라미터를 찍는다).
logging.level.com.prafta.web.subcon.subcon03.mapper=INFO

# ===== PRAFTA RAG(AI 검색) — pgvector 코퍼스 2차 데이터소스 + TEI 임베딩 =====
# prod 프로필: 접속정보/비밀은 전부 환경변수로만 주입(불안전한 기본값 금지).
prafta.ai.datasource.url=${AI_DB_URL}
prafta.ai.datasource.username=${AI_DB_USERNAME}
prafta.ai.datasource.password=${AI_DB_PASSWORD}
prafta.ai.datasource.driver-class-name=org.postgresql.Driver
prafta.ai.tei.url=${AI_TEI_URL}
prafta.ai.tei.timeout-ms=${AI_TEI_TIMEOUT:120000}
prafta.ai.search.default-top-k=${AI_SEARCH_DEFAULT_TOPK:5}
prafta.ai.search.max-top-k=${AI_SEARCH_MAX_TOPK:20}
# 위험성평가 AI 도출 그라운딩 최소 유사도(cosine). 이 값 미만 청크는 근거 미채택 → 전부 미달이면 자유생성(ABSTAINED).
# 환경 의존 튜닝값: 도출 로그의 topScore 분포를 보고 조정한다(기본 0.40).
prafta.ai.search.derive-min-score=${AI_SEARCH_DERIVE_MIN_SCORE:0.40}
# LLM 근거답변(ai01/answer, Phase 2 + 위험성평가 AI 도출). 공급자=HyperCLOVA X(HCX-005). ★기본 OFF 게이트.
# CLOVA_STUDIO_API_KEY 는 ${CLOVA_STUDIO_API_KEY:} 플레이스홀더 주입(env 또는 secrets/platform-bootstrap.properties). 평문 금지.
prafta.ai.llm.enabled=${AI_LLM_ENABLED:false}
prafta.ai.llm.host=${AI_LLM_HOST:https://clovastudio.stream.ntruss.com}
prafta.ai.llm.model=${AI_LLM_MODEL:HCX-005}
prafta.ai.llm.max-tokens=${AI_LLM_MAX_TOKENS:4096}
prafta.ai.llm.temperature=${AI_LLM_TEMPERATURE:0.2}
prafta.ai.llm.top-p=${AI_LLM_TOP_P:0.8}
prafta.ai.llm.top-k=${AI_LLM_TOP_K:0}
prafta.ai.llm.repetition-penalty=${AI_LLM_REPETITION_PENALTY:1.1}
prafta.ai.llm.cost-per1k-input=${AI_LLM_COST_PER1K_INPUT:0}
prafta.ai.llm.cost-per1k-output=${AI_LLM_COST_PER1K_OUTPUT:0}
prafta.ai.llm.answer-top-k=${AI_LLM_ANSWER_TOP_K:6}

# ===== 업로드 파일 서명 URL 절대 host (FileUrlSigner) =====
# 미설정 시 요청 헤더(X-Forwarded-Proto/Host)로 host/scheme 을 추론하는데, nginx 가
# X-Forwarded-Proto 를 $http_x_forwarded_proto(클라이언트가 보낸 값 그대로 전달)로 설정해
# 앱이 보내지 않는 이 헤더가 항상 비어 있다 — 그 결과 req.getScheme() 폴백이 nginx→Tomcat
# 내부 평문 연결의 스킴("http")을 그대로 물어 서명 URL이 http:// 로 발급되고, 안드로이드
# 웹뷰의 mixedContentMode(NEVER_ALLOW)에 걸려 TBM 교육자료 이미지가 안 뜨는 결함이 있었다
# (iOS WKWebView 는 mixed content 에 더 관대해 재현되지 않았다). host/scheme 을 이 값으로
# 고정해 헤더 추론 자체를 우회한다(비밀값 아님 — 운영 공개 도메인).
file.public-base-url=https://api.prafta.com

# ===== 애플리케이션 로그 파일 경로 (logback-spring.xml 의 FILE 어펜더가 참조, prod 프로필 전용) =====
# Spring Boot 기본 file-appender.xml 은 SizeAndTimeBasedRollingPolicy 가 고정이라 파일명에 %i(순번)
# 토큰이 강제된다 — 순수 날짜별 네이밍(%i 없음)을 쓰려고 logback-spring.xml 을 직접 정의했다.
# 환경변수 LOG_FILE_DIR 로 경로 override 가능(운영 서버 경로 지정용). 디렉토리는 최초 로깅 시 자동 생성됨.
log.file.dir=${LOG_FILE_DIR:${user.dir}/logs}
logging.logback.rollingpolicy.max-history=0
logging.logback.rollingpolicy.clean-history-on-start=false

spring.profiles.active=local

# MyBatis \uC124\uC815
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# MyBatis SQL Log Print
logging.level.com.prafta=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG

# jwt (정책 §3.4: access 1시간)
# refresh 토큰 만료는 LoginServiceImpl의 INTERVAL DAY로 관리하므로 별도 프로퍼티를 두지 않는다.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# login
login.lock.duration-minutes=3
login.lock.max-fail-count=5

# BCrypt strength (10~14 권장, 클수록 안전하지만 느림)
security.password.bcrypt.strength=12

# 비밀번호 해싱용
security.password.pepper=${SECURITY_PASSWORD_PEPPER}

# 난수 비밀번호 바이트 길이 (24바이트 → Base64 약 32자)
security.password.random.byte-length=24

# ===== 스프링에서 mapper 빈 생성/스캔 관련 =====
logging.level.org.springframework.beans.factory.support=INFO
logging.level.org.springframework.context.annotation=INFO

# ===== JDBC SQL 실행 로그(선택) =====
logging.level.org.springframework.jdbc=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
mybatis.configuration.map-underscore-to-camel-case=true

# HTTP 응답 한글 인코딩 강제 (mojibake 방지, prafta-010-003)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# RefreshToken HMAC용
crypto.hmacPepper=${PRAFTA_REFRESH_TOKEN_PEPPER}
# AES 암호화용
crypto.aesKey=${PRAFTA_AES_DATA_KEY}

# Holiday API KEY
holiday.api.base-url=${HOLIDAY_API_BASE_URL:http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo}
holiday.api.service-key=${HOLIDAY_API_SERVICE_KEY:}
holiday.api.num-of-rows=${HOLIDAY_API_NUM_OF_ROWS:100}
holiday.api.type=${HOLIDAY_API_TYPE:json}
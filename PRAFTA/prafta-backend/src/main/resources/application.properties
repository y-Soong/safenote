spring.profiles.active=local

# MyBatis \uC124\uC815
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# ===== DB \uCEE4\uB125\uC158 \uD480(HikariCP) =====
# \u2605\u2605[SMS 3\uCC28 / sec N-8] \uC774 \uC124\uC815\uC740 SMS \uBB34\uAD00 <b>\uC804\uC5ED</b> \uC601\uD5A5\uC774\uB2E4. \uAC12 \uBCC0\uACBD \uC2DC \uC804 \uAE30\uB2A5\uC774 \uC601\uD5A5\uC744 \uBC1B\uB294\uB2E4.
# [\uC65C \uBA85\uC2DC\uD558\uB294\uAC00] \uC9C0\uAE08\uAE4C\uC9C0 spring.datasource.hikari.* \uC124\uC815\uC774 0\uAC74\uC774\uB77C Boot \uAE30\uBCF8\uAC12(maximumPoolSize=10,
#   connectionTimeout=30000ms)\uC73C\uB85C \uB3D9\uC791\uD588\uB2E4. SMS \uBC1C\uC1A1 \uC0C1\uD55C\uC774 \uC804\uC5ED \uC815\uCC45\uD589\uC744 SELECT ... FOR UPDATE \uB85C
#   \uC9C1\uB82C\uD654\uD558\uBBC0\uB85C, \uB300\uAE30 \uC911\uC778 \uC694\uCCAD\uB3C4 \uC774\uBBF8 \uCEE4\uB125\uC158\uC744 \uC954 \uC0C1\uD0DC\uB85C \uC904\uC744 \uC120\uB2E4.
#   \uD480\uC774 10 \uC774\uBA74 \uB3D9\uC2DC \uC694\uCCAD \uC18C\uC218\uB9CC\uC73C\uB85C \uD480\uC774 \uACE0\uAC08\uB418\uC5B4 <b>SMS \uC640 \uBB34\uAD00\uD55C \uADFC\uD0DC\u00B7\uC5F0\uCC28\u00B7\uACB0\uC7AC \uC804 \uAE30\uB2A5\uC774 \uD568\uAED8 \uC2E4\uD328</b>\uD55C\uB2E4.
# [maximum-pool-size=20] security \uAD8C\uACE0\uAC12. RDS MySQL 8.4 \uC758 max_connections \uB300\uBE44 \uC5EC\uC720\uAC00 \uD06C\uACE0,
#   \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC778\uC2A4\uD134\uC2A4\uAC00 \uB298\uBA74 \uC778\uC2A4\uD134\uC2A4 \uC218 x 20 \uC774 \uB418\uBBC0\uB85C \uC2A4\uCF00\uC77C\uC544\uC6C3 \uC2DC \uC7AC\uAC80\uD1A0\uD560 \uAC83.
# [connection-timeout=3000] \uAE30\uBCF8 30\uCD08\uB294 "\uD480 \uACE0\uAC08 \uC2DC \uC0AC\uC6A9\uC790\uAC00 30\uCD08 \uAE30\uB2E4\uB9B0 \uB4A4 500" \uC774\uB77C\uB294 \uB73B\uC774\uB2E4.
#   3\uCD08\uB85C \uC904\uC5EC \uBE60\uB974\uAC8C \uC2E4\uD328\uC2DC\uD0A4\uACE0, \uC694\uCCAD \uC2A4\uB808\uB4DC/\uD1B0\uCEA3 \uC2A4\uB808\uB4DC\uAC00 \uC7A5\uC2DC\uAC04 \uBB36\uC774\uB294 \uAC83\uC744 \uB9C9\uB294\uB2E4.
#   \u2605\uC6F9\u00B7\uC571 axios timeout \uC774 10\uCD08\uB77C 3\uCD08 \uC2E4\uD328\uB294 \uC0AC\uC6A9\uC790\uC5D0\uAC8C \uC815\uC0C1\uC801\uC73C\uB85C \uC5D0\uB7EC\uB85C \uB3C4\uB2EC\uD55C\uB2E4.
# \uB450 \uAC12 \uBAA8\uB450 \uD658\uACBD\uBCC0\uC218\uB85C \uB36E\uC5B4\uC4F8 \uC218 \uC788\uB2E4(\uC6B4\uC601\uC5D0\uC11C \uD29C\uB2DD \uC2DC \uC7AC\uBC30\uD3EC \uBD88\uD544\uC694).
# [SMS 4차 / sec T-6 · qa R-8] connection-timeout 을 3000 -> 5000 으로 조정한다(과도기값).
#   - Hikari connectionTimeout 은 "풀에서 커넥션을 얻기까지의 대기" 지 쿼리 실행 제한이 아니다.
#     따라서 장시간 배치를 직접 깨뜨리지는 않는다(qa R-8 실측 판정).
#   - 그럼에도 5000 으로 두는 이유: ① 운영이 아직 TRACE + p6spy 상태라 statement 지연이 상시 증가해
#     커넥션 점유가 길고, ② 애플리케이션 기동 시 첫 커넥션 확보 예산도 이 값이라 RDS 가 느린 순간
#     (재기동 직후·페일오버)에 기동이 실패할 수 있다. 실측 후 3000 으로 내리는 것은 별건.
#   - DBConfig 는 @Configuration 이 없어 비활성이므로(사장 코드) Boot 자동설정 Hikari 가 사용되고
#     이 두 프로퍼티가 실제로 적용된다 - 4차에서 재확인 완료.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}

# MyBatis SQL Log Print
logging.level.com.prafta=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.apache.ibatis=DEBUG

# jwt (정책 §3.4: access 1시간)
# refresh 토큰 만료는 LoginServiceImpl의 INTERVAL DAY로 관리하므로 별도 프로퍼티를 두지 않는다.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# login
login.lock.duration-minutes=3
login.lock.max-fail-count=5

# BCrypt strength (10~14 권장, 클수록 안전하지만 느림)
security.password.bcrypt.strength=12

# 비밀번호 해싱용
security.password.pepper=${SECURITY_PASSWORD_PEPPER}

# 난수 비밀번호 바이트 길이 (24바이트 → Base64 약 32자)
security.password.random.byte-length=24

# ===== 스프링에서 mapper 빈 생성/스캔 관련 =====
logging.level.org.springframework.beans.factory.support=INFO
logging.level.org.springframework.context.annotation=INFO

# ===== JDBC SQL 실행 로그(선택) =====
logging.level.org.springframework.jdbc=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
mybatis.configuration.map-underscore-to-camel-case=true

# HTTP 응답 한글 인코딩 강제 (mojibake 방지, prafta-010-003)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# RefreshToken HMAC용
crypto.hmacPepper=${PRAFTA_REFRESH_TOKEN_PEPPER}
# AES 암호화용
crypto.aesKey=${PRAFTA_AES_DATA_KEY}

# 업로드 파일 저장/서빙 루트 디렉토리
# - 환경변수 FILE_UPLOAD_BASE_DIR 로 덮어쓴다(운영 서버 경로 지정용).
# - 미지정 시 기본값은 실행 디렉토리(user.dir)/uploads → 기존 로컬 동작과 동일.
# - 정적 서빙 핸들러(/uploads/**)와 파일 저장 로직이 이 값을 공통으로 사용한다.
file.upload.base-dir=${FILE_UPLOAD_BASE_DIR:${user.dir}/uploads}

# 보호 파일(FILE_TYPE 007 — 일용직 근로계약서 원본/서명 PNG/합성본) 저장 루트 디렉토리
# - SEC-1: 근로계약서는 성명+자필서명 포함 PII 법정 문서라 무인증 정적 서빙(/uploads/**) 마운트 밖에 분리 저장한다.
#   인증 스트림 API(contract-image/sign-image)로만 서빙되며 정적 URL 로 접근 불가.
# - 환경변수 FILE_UPLOAD_SECURE_BASE_DIR 로 덮어쓴다(운영 서버 경로 지정용).
# - 미지정 시 기본값은 file.upload.base-dir 의 형제 디렉토리({base}-secure). 디렉토리는 저장 시 자동 생성된다.
file.upload.secure-base-dir=${FILE_UPLOAD_SECURE_BASE_DIR:${file.upload.base-dir}-secure}

# ===== 업로드 파일 서빙 보안(서명 URL) =====
# 서명 전용 시크릿(env FILE_SIGN_SECRET). jwt.secret 재사용 금지. 미설정 시 서명 비활성(관대모드 전제, 운영 배포 전 필수 설정).
file.sign.secret=${FILE_SIGN_SECRET:}
# 서명 유효시간(초). 기본 1800(30분).
file.sign.ttl-seconds=${FILE_SIGN_TTL:1800}
# 필터 모드: false=관대(미서명/서명실패 통과 + 경고로그), true=강제(서명실패 403).
# 이번 라운드는 false 유지(TBM 외 모듈 미전환 호환). 전 모듈 전환 후 향후 라운드에서 true.
file.sign.enforce=${FILE_SIGN_ENFORCE:false}
# 서명 절대 URL host(예: http://172.30.1.4:8080). 미설정 시 요청 X-Forwarded-Host/Host 폴백.
file.public-base-url=${FILE_PUBLIC_BASE_URL:}

# Holiday API KEY
holiday.api.base-url=${HOLIDAY_API_BASE_URL:http://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo}
holiday.api.service-key=${HOLIDAY_API_SERVICE_KEY:}
holiday.api.num-of-rows=${HOLIDAY_API_NUM_OF_ROWS:100}
holiday.api.type=${HOLIDAY_API_TYPE:json}

# ===== PRAFTA-COM-002 FCM 공용 PUSH 전송 워커 (consumer) =====
# FCM 서비스 계정 키 JSON 파일 경로. 미설정(빈 값)이면 워커가 초기화하지 않고 조용히 skip.
# 키 파일/원문은 절대 커밋 금지(.env.example 에는 변수 이름만).
push.fcm.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# 워커 게이트. local 환경에서 직접 ON(환경변수 PUSH_WORKER_ENABLED 로도 override 가능).
prafta.push.worker.enabled=${PUSH_WORKER_ENABLED:true}
# 발송 주기(ms, fixedDelay). 기본 30초.
prafta.push.worker.interval-ms=${PUSH_WORKER_INTERVAL_MS:30000}
# 1주기 claim 배치 건수.
prafta.push.worker.batch-size=${PUSH_WORKER_BATCH_SIZE:50}
# 최대 재시도 횟수(초과 시 FAILED 고정).
prafta.push.worker.max-retry=${PUSH_WORKER_MAX_RETRY:3}

# ===== PRAFTA-051 TBM 15분 자동 교육시작 배치 =====
# 게이트(기본 비활성). 마이그(PREP_START_AT) 선적용 + 운영 검증 후 수동 ON.
prafta.tbm.autostart.enabled=${TBM_AUTOSTART_ENABLED:false}
# 실행 주기(ms, fixedDelay). 기본 30초.
prafta.tbm.autostart.interval-ms=${TBM_AUTOSTART_INTERVAL_MS:30000}

# ===== PRAFTA-COM-008-A 연차 사용촉진 일배치 =====
# 게이트(기본 비활성). 마이그(prafta-com-008-a-0) 선적용 + 연차부여행 존재 확인 후 수동 ON.
prafta.leave-promotion.enabled=${LEAVE_PROMOTION_ENABLED:false}
# 실행 cron(초 분 시 일 월 요일, Asia/Seoul). 기본 매일 00:40(연차부여 00:30 / 기본스케줄 00:35 직후).
prafta.leave-promotion.cron=${LEAVE_PROMOTION_CRON:0 40 0 * * *}

# ===== PRAFTA-COM-008-E 기본 근무타입 자동 스케줄 생성 =====
# [동작] 앱 로그인 시 '기본 근무타입 설정' 게이트(gate.enabled)를 통과하면 사용자의 DEFAULT_SCH_CD 가 저장되고,
#        gen.enabled 가 ON 일 때만 오늘~당해 12/31 의 빈 평일에 근무계획(TB_USER_WORK_PLAN, GEN_SOURCE='DEFAULT_SCH')을 즉시 자동 생성한다.
# [주의] 두 토글은 분리되어 있다. gate.enabled=true 라도 gen.enabled=false 이면 설정값(DEFAULT_SCH_CD)만 저장되고 스케줄은 생성되지 않는다.
# [한계] 이미 DEFAULT_SCH_CD 가 설정된 사용자는 게이트가 다시 뜨지 않으므로, gen.enabled 를 켠 시점 이후 신규 설정자부터 즉시 생성된다.
#        기존 설정자 소급은 연 1회(1/1) 스케줄러 또는 DEFAULT_SCH_CD 리셋 후 재설정으로 처리한다.
# 게이트 화면 노출 토글(기본 true). false 로 두면 로그인 시 기본 근무타입 설정 화면을 띄우지 않는다.
prafta.default-sch.gate.enabled=${DEFAULT_SCH_GATE_ENABLED:true}
# 자동 스케줄 생성 토글(관리자 공수 절감 목적). true=설정 즉시 평일 근무계획 자동 생성, false=설정값만 저장(생성 스킵).
prafta.default-sch.gen.enabled=${DEFAULT_SCH_GEN_ENABLED:true}
# 연 1회(매년 1/1) 배치 cron. 매핑 누락 상태였음(다른 13종과 관례 통일, 2026-08-24) — 이전엔 운영 파일에
# DEFAULT_SCH_GEN_CRON 을 넣어도 반영되지 않았다(함정 A와 동일 유형, 스케줄러_전면_활성화_작업지시서 참고).
prafta.default-sch.gen.cron=${DEFAULT_SCH_GEN_CRON:0 35 0 1 1 *}

# ===== PRAFTA-app-027-1 일용직 만료 자정 비활성 배치 =====
# 게이트(기본 활성, prafta-com-010 후속 일용직 생명주기 정비로 ON). cron 자정(0 0 0 * * *) 고정.
# 대상: WORK_EXPIRE_DATE < 오늘 → 슬롯 반납(고정슬롯 제외) + TB_USER/SITE_AUTH/TB_DAILY_USER USE_YN='N'+'05'(멱등).
# 필요 시 환경변수 DAILY_USER_EXPIRE_ENABLED=false 로 즉시 비활성 전환 가능.
prafta.daily-user.expire.enabled=${DAILY_USER_EXPIRE_ENABLED:true}

# ===== PRAFTA-WEB_001-2 소속이동(transfer) 발효 자정 배치 =====
# [동작] STATUS='RESERVED' + MOVE_DATE <= 오늘 인 예약을 조회해 사용자의 SITE_CD/NODE_CD(+정규직 DEFAULT_SCH_CD)를
#        일괄 변경하고 STATUS='APPLIED' 로 전이한다. 발효 시점에 5종 불가케이스를 재검증하며,
#        재검증 실패분은 STATUS='FAILED'(FAIL_REASON 기록)로 남기고 나머지는 계속 진행한다(멱등).
#        발효되면 이동자가 신청자·결재자인 진행 중 요청은 반려/취소로 정리된다(확정 정책).
# [주의] 게이트를 켜는 순간 "기한이 지난 예약"까지 첫 배치에서 한꺼번에 발효된다.
#        운영 전환 전 TB_USER_TRANSFER_RESERVATION 의 RESERVED 행을 반드시 점검할 것.
# 게이트(기본 false). 운영 검증 후 TRANSFER_EXECUTE_ENABLED=true 로 전환.
prafta.transfer.execute.enabled=${TRANSFER_EXECUTE_ENABLED:false}
# 실행 cron(초 분 시 일 월 요일, Asia/Seoul). 기본 매일 00:10.
# ※ 테스트로 주기를 짧게 바꾸려면 환경변수 TRANSFER_EXECUTE_CRON 으로만 덮어쓸 것(파일 직접 수정 금지 — 원복 누락 방지).
prafta.transfer.execute.cron=${TRANSFER_EXECUTE_CRON:0 10 0 * * *}

# ===== PRAFTA-COM-001-T2-3 사업장 만료(종료일 도래) 자정 비활성 배치 =====
# 게이트(기본 false, 운영 검증 후 ON). cron 자정(0 0 0 * * *) 고정.
# 대상: END_DATE <= 오늘 AND USE_YN='Y' → USE_YN='N'(멱등). 미래 종료일 도래분을 담당
# (당일/과거 종료일 즉시 비활성은 저장 시 서비스에서 처리).
# 운영 활성화 시 환경변수 SITE_EXPIRE_ENABLED=true 로 전환.
prafta.site.expire.enabled=${SITE_EXPIRE_ENABLED:false}

# ===== SMS 발송(뿌리오) - 인증번호 전용 (D2. 일반 알림은 FCM PUSH 소관) =====
# [게이트] 기본 false. 키 미설정 환경(타 개발자 로컬/CI)에서 부팅이 깨지지 않게 하기 위함이며,
#          운영/개발 서버는 secrets/platform-bootstrap.properties 의 PPURIO_ENABLED 가 이 값을 덮는다(D4: 초기값 true).
# [★운영 토글 확인법] 코드 기본값만 보고 판단하지 말 것. 서버의 secrets 파일을 직접 grep 해야 실제 상태를 안다
#          (선례: PUSH_WORKER_ENABLED 가 시크릿에 false 로 박혀 PUSH 가 조용히 꺼져 있었음).
# [동작] 게이트 OFF 또는 계정/인증키/발신번호 미설정 시 발송을 시도하지 않고 SEND_STATUS='SKIPPED' 로만 기록한다.
#        사용자 응답은 기존과 동일한 성공(무회귀). 발송 실패일 때만 502(SMS_502_*)를 내려 프론트가 에러를 노출한다.
prafta.sms.enabled=${PPURIO_ENABLED:false}
prafta.sms.ppurio.base-url=${PPURIO_BASE_URL:https://message.ppurio.com}
# 계정/인증키 원문은 이 파일에 절대 하드코딩하지 않는다(플레이스홀더만).
prafta.sms.ppurio.account=${PPURIO_ACCOUNT:}
prafta.sms.ppurio.api-key=${PPURIO_API_KEY:}
# 사전등록 발신번호(하이픈 없이). 전기통신사업법상 미등록 발신번호는 전량 실패한다.
prafta.sms.ppurio.from=${PPURIO_FROM:}
prafta.sms.ppurio.connect-timeout-ms=${PPURIO_CONNECT_TIMEOUT_MS:5000}
# 발송은 사용자 요청 스레드에서 동기 수행된다(D5). 값을 늘리면 화면 대기시간이 그대로 늘어난다.
# [SMS2-D1 / qa D-2] 10000 → 6000.
#   웹·앱 axios timeout 이 10초다(src/api/axios.js). 백엔드가 그보다 먼저 응답해야 설계한 SMS_502_* 메시지가
#   사용자에게 도달한다. connect 5000 + read 6000 = 단일 왕복 최악 11초이므로, 토큰 캐시가 살아 있는
#   정상 국면(왕복 1회)에서만 보장된다. 토큰+발송 2왕복이 필요한 첫 발송은 여전히 클라이언트가 먼저 끊을 수 있어
#   PpurioClient.SEND_BUDGET_MS(8초 전체 예산) 로 한 번 더 닫았다.
prafta.sms.ppurio.read-timeout-ms=${PPURIO_READ_TIMEOUT_MS:6000}

# ===== SMS 발송 상한 - IP 축 해석(SMS2-B2) =====
# [1단계 = 관측 전용] IP 축의 실제 차단 여부는 DB(TB_SMS_SEND_POLICY.IP_AXIS_ENABLED_YN, 기본 'N')가 결정한다.
#   아래 3개는 "IP 를 어떻게 해석할 것인가" 만 정한다. 해석에 실패하면 IP 축을 건너뛴다(fail-open).
# [★왜 2단계인가] 운영 nginx 설정(/etc/nginx/conf.d/prafta.conf)은 레포 밖(EC2 로컬)이라
#   X-Forwarded-For 가 누적(proxy_add_x_forwarded_for)인지 덮어쓰기($remote_addr)인지 정적으로 확인할 수 없다.
#   홉 수를 잘못 잡은 채 차단하면 ①전 사용자가 같은 버킷으로 묶여 마비되거나 ②위조분이 채택되어 무의미해진다.
#   따라서 먼저 진단 로그([SMS상한:IP축진단])로 실제 구조를 계측하고, 확정 후 화면에서 축을 켠다.
#
# Spring 에 직접 연결하는 신뢰 프록시(=nginx) 주소 목록(콤마구분).
#   ★비어 있으면 X-Forwarded-For 를 신뢰하지 않는다 = IP 축 전면 스킵. 로컬·개발은 이 상태가 정상이다.
prafta.sms.ip.trusted-proxies=${SMS_IP_TRUSTED_PROXIES:}
# X-Forwarded-For 를 오른쪽에서 셀 때 건너뛸 자사 인프라 홉 수. CloudFront 엣지 1홉 → 1.
#   ★선두(왼쪽)를 쓰지 않는 이유: 선두는 클라이언트가 헤더로 임의로 채워 넣을 수 있는 구간이다.
prafta.sms.ip.trusted-hops=${SMS_IP_TRUSTED_HOPS:1}
# XFF 구조 진단 로그(토큰 개수 + 각 토큰의 분류만. ★평문 IP 는 절대 출력하지 않는다).
#   홉 수 확정 후 false 로 내린다.
prafta.sms.ip.diagnostic=${SMS_IP_DIAGNOSTIC:true}

# ===== SMS 인증 보존기간 정리 배치 (4차 / sec T-11 · T-3) =====
# [대상] TB_SMS_VERIFY_ATTEMPT(검증 시도 로그) / TB_SMS_AUTH_CODE(인증코드).
#        둘 다 평문 PII 는 없으나(HMAC·AES-GCM) 특정 번호의 인증 이력이라 준식별 데이터다(공통 정책서 §11.3).
# [게이트] 기본 false. ★되돌릴 수 없는 물리 삭제이므로, 켜기 전에 반드시 삭제 대상 건수를 SELECT 로 확인할 것.
#          운영 활성화 시 환경변수 SMS_RETENTION_ENABLED=true 로 전환.
# [안전장치] days/batch-size 가 0 이하이면 실행하지 않는다(설정 오타로 전량 삭제되는 것을 막는다).
#            삭제는 batch-size 단위로 나눠 커밋한다 - 한 트랜잭션으로 대량 삭제하면 갭락으로 인증 흐름이 막힌다.
# [영향 없음 근거] 상한 판정의 최대 조회 구간은 1일, Platform_05 통계는 24시간이라 보존일수(90일) 안쪽이다.
prafta.sms.retention.enabled=${SMS_RETENTION_ENABLED:false}
prafta.sms.retention.days=${SMS_RETENTION_DAYS:90}
prafta.sms.retention.batch-size=${SMS_RETENTION_BATCH_SIZE:1000}
# 실행 cron(초 분 시 일 월 요일, Asia/Seoul). 기본 매일 04:20(공지 정리 04:10 직후).
prafta.sms.retention.cron=${SMS_RETENTION_CRON:0 20 4 * * *}

# ===== 스케줄러 전면 활성화 정비 (2026-08-20, .claude/refs/스케줄러_전면_활성화_작업지시서.md) =====
# ★스케줄러 스레드풀. 종전 설정 부재로 기본 1개였고, 운영 로그상 14종 전부 [scheduling-1] 단일
#   스레드를 공유했다. 연차 자동부여처럼 오래 도는 배치를 켜면 그동안 PUSH 전송(30초 워커)과
#   TBM 자동시작이 그대로 밀린다. 배치 활성화의 전제 조건이라 함께 상향한다.
#   5 = 상시 워커 3종(Push/TbmAutoStart/AttdReminder) + 일배치 동시 구간(00:00 두 건) 여유.
#   ※스레드만 늘릴 뿐 배치 간 순서를 보장하지 않는다 — 같은 데이터를 만지는 배치의 시각 분리는 cron 으로 유지.
spring.task.scheduling.pool.size=${TASK_SCHEDULING_POOL_SIZE:5}

# 아래 3종은 스케줄러가 @Value("${...:false}") 로 점 표기 프로퍼티를 읽고 있었으나 여기에 ENV 매핑
#   줄이 없어, 운영 설정 파일에 ENV 스타일 키(LEAVE_AUTO_GRANT_ENABLED 등)를 넣어도 무시됐다.
#   나머지 11종의 ${ENV:기본값} 관례에 맞춰 매핑을 추가한다(코드 기본값 false 는 유지 — 형상 안전).
#   cron 키도 함께 매핑해야 검증 시 cron 임시 단축이 가능하다(지시서 §4-1).
# 연차 자동 정기부여(00:30)
prafta.leave.auto-grant.enabled=${LEAVE_AUTO_GRANT_ENABLED:false}
prafta.leave.auto-grant.cron=${LEAVE_AUTO_GRANT_CRON:0 30 0 * * *}
# 공지 확인이력 정리(04:10)
prafta.notice.ack-cleanup.enabled=${NOTICE_ACK_CLEANUP_ENABLED:false}
prafta.notice.ack-cleanup.cron=${NOTICE_ACK_CLEANUP_CRON:0 10 4 * * *}
# 출퇴근 5분 전 리마인더 워커(매분)
prafta.attd-reminder.worker.enabled=${ATTD_REMINDER_WORKER_ENABLED:false}
prafta.attd-reminder.worker.cron=${ATTD_REMINDER_WORKER_CRON:0 * * * * *}

# ===== 공휴일 동기화 스케줄 (2026-08-20 복원) =====
# 종전 @Scheduled 가 코드에서 주석 처리돼 스케줄 자체가 등록되지 않았다(신규 고객사 프로비저닝
#   afterCommit 이 유일한 호출 경로 → 회사가 안 생기면 공휴일이 영영 갱신되지 않음).
#   다른 13종 관례에 맞춰 게이트 + cron 을 프로퍼티화하고 스케줄을 복원한다.
#   ★holiday.api.service-key 가 비어 있으면 호출이 실패하므로 운영 파일에 키가 있는지 먼저 확인할 것.
prafta.holiday.sync.enabled=${HOLIDAY_SYNC_ENABLED:false}
# 내년 공휴일 동기화: 매년 12/25 03:10
prafta.holiday.sync.next-year-cron=${HOLIDAY_SYNC_NEXT_YEAR_CRON:0 10 3 25 12 *}
# 올해 공휴일 재동기화(보정 대응): 매월 1일 04:00
prafta.holiday.sync.resync-cron=${HOLIDAY_SYNC_RESYNC_CRON:0 0 4 1 * *}
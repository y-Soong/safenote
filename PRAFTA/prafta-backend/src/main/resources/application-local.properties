# ===== 로컬(local) 프로파일 전용 설정 =====
# 모든 값은 환경변수로 덮어쓸 수 있다. 시크릿(비밀번호/API 키)은 파일에 원문을 넣지 말고
# 환경변수 또는 secrets/platform-bootstrap.properties 로만 주입한다.

# ===== 로그 파일 출력(로컬 전용) =====
# 콘솔에만 찍히면 500 에러의 스택을 사후에 확인할 수 없다(디버깅 시 매번 콘솔을 눈으로 훑어야 함).
# 로컬에서는 파일로도 남겨 원인 추적을 자동화한다. 운영(prod)에는 이 설정이 적용되지 않는다.
# ※ 이 로그에는 SQL 바인드 파라미터(p6spy)가 포함되므로 로컬 개발 PC 밖으로 반출 금지.
logging.file.name=${LOG_FILE:logs/prafta-local.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=3

# ===== DB =====
# p6spy 드라이버로 감싸서 실행 SQL 을 로그로 확인한다.
spring.datasource.url=${DB_URL:jdbc:p6spy:mysql://localhost:3306/prafta?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:dev_prafta}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver

mybatis.configuration.map-underscore-to-camel-case=true

# ===== 업로드 파일 서명 URL 의 공개 host =====
# 로컬/개발은 비워 둔다. 비어 있으면 요청 헤더(X-Forwarded-Proto/Host)로 host 를 결정하므로
# PC 의 IP 가 바뀌어도 이 값을 고칠 필요가 없다(IP 하드코딩 금지, DHCP 대응).
# 앱 웹뷰는 페이지와 같은 출처로 파일을 받아야 mixed-content 차단을 피할 수 있다.
# 운영(리버스 프록시)에서는 환경변수 FILE_PUBLIC_BASE_URL 로 공개 host 를 고정한다.
file.public-base-url=${FILE_PUBLIC_BASE_URL:}

# ===== 플랫폼 운영자 API(/platformApi/**) 접근 IP 허용목록 =====
# 콤마로 구분. 비워 두면 IP 검사를 생략한다(개발 편의).
# 운영에서는 반드시 환경변수 PLATFORM_ALLOWED_IPS 로 사무실/VPN IP 를 지정할 것.
# IP 설정과 무관하게 운영자 인가(JWT 회사코드 = prafta_system_admin)는 항상 강제된다.
prafta.platform.allowed-ips=${PLATFORM_ALLOWED_IPS:}

# ===== 플랫폼 게이트 신뢰 프록시 목록 =====
# 콤마로 구분. RemoteAddr(직접 연결 IP)가 이 목록에 있을 때만 X-Forwarded-For 선두를 클라이언트 IP 로 채택한다.
# 비워 두면(기본) XFF 를 신뢰하지 않고 RemoteAddr 를 그대로 사용한다(fail-safe — XFF 위조 방지).
# ⚠️ 리버스 프록시 뒤에 배포할 때는 반드시 프록시 IP 를 설정할 것 —
#    미설정 시 allowed-ips 게이트가 실제 클라이언트가 아닌 프록시 IP 를 보게 되어 IP 허용목록이 오동작한다.
prafta.platform.trusted-proxies=${PLATFORM_TRUSTED_PROXIES:}

# ===== 최초 플랫폼 운영자 부트스트랩 =====
# true 로 켜고 아래 4개 값을 환경변수로 주입한 뒤 1회 기동하면 운영자 회사/계정이 생성된다(멱등).
# 생성 직후 반드시 다시 false 로 되돌릴 것(기동 로그가 경고로 안내한다).
prafta.platform.bootstrap.enabled=${PLATFORM_BOOTSTRAP_ENABLED:true}
# 운영자 로그인 ID
prafta.platform.bootstrap.operator-id=${PLATFORM_BOOTSTRAP_OPERATOR_ID:}
# 운영자 초기 비밀번호(평문 주입 → BCrypt 해시로 저장)
prafta.platform.bootstrap.operator-pw=${PLATFORM_BOOTSTRAP_OPERATOR_PW:}
# 운영자 이름
prafta.platform.bootstrap.operator-nm=${PLATFORM_BOOTSTRAP_OPERATOR_NM:}
# 운영자 휴대폰번호(AES-GCM 암호화 저장)
prafta.platform.bootstrap.operator-mbl=${PLATFORM_BOOTSTRAP_OPERATOR_MBL:}

# ===== AI 검색(RAG) — pgvector 코퍼스 + TEI 임베딩 =====
# 로컬 기본값은 개발 편의로 localhost 를 가리킨다. 운영은 환경변수로 주입한다.
prafta.ai.datasource.url=${AI_DB_URL:jdbc:postgresql://localhost:5432/prafta_ai}
prafta.ai.datasource.username=${AI_DB_USERNAME:prafta}
prafta.ai.datasource.password=${AI_DB_PASSWORD:prafta1234}
prafta.ai.datasource.driver-class-name=org.postgresql.Driver

# 임베딩 서버(BGE-m3, 1024차원). 호출 시 '/embed' 를 붙여 POST 한다.
prafta.ai.tei.url=${AI_TEI_URL:http://localhost:8090}
prafta.ai.tei.timeout-ms=${AI_TEI_TIMEOUT:120000}

# 검색 topK 기본값 / 상한(서비스에서 클램프)
prafta.ai.search.default-top-k=${AI_SEARCH_DEFAULT_TOPK:5}
prafta.ai.search.max-top-k=${AI_SEARCH_MAX_TOPK:20}

# 법령 전용 트랙 최소 유사도(prafta-062, riskai01 searchLawTrack). 초기값 0.40 = derive-min-score 와 동일 출발.
# 법령 조문은 문체가 달라 점수 분포가 다를 수 있음 — "법령 트랙 판정" 로그 관측 후 조정한다.
prafta.ai.search.law-min-score=${AI_SEARCH_LAW_MIN_SCORE:0.40}
# verbatim(참고 원문·SIF) 트랙 최소 유사도(prafta-064 S1, riskai01 selectVerbatimRefs). 초기값 0.40 = derive-min-score 와 동일 출발.
# 미달 후보는 선택 호출에 넘기지 않고 통과 0건이면 선택 호출 생략 — "verbatim 트랙 판정" 로그 관측 후 조정(0 = 사실상 임계 해제, [0,1] 밖이면 기동 warn + 0.40).
prafta.ai.search.verbatim-min-score=${AI_SEARCH_VERBATIM_MIN_SCORE:0.40}
# 검색·선택용 질의 모드(prafta-064 S2, riskai01 derive). compact = 라벨 없는 관리자 확정문(기본) / full = 종전 buildDeriveQuery 결과(즉시 원복 수단).
# 생성 호출(그라운딩/자유생성) 입력은 모드와 무관하게 항상 full. 허용값 외면 기동 warn + compact.
prafta.ai.search.search-query-mode=${AI_SEARCH_QUERY_MODE:compact}
# 법령 조문 사후 첨부 스위치(riskai01 attachLawRefs). ★2026-09-04 보류(기본 false): 유사도 판별력 부족으로 무관 조문 첨부 →
# 재설계(LLM 선별 등) 검토 후 true 로 재개. false 면 법령 검색·임베딩 호출 생략, 화면 관련 법령 블록 미표시(062 이전 형태).
prafta.ai.search.law-refs-enabled=${AI_SEARCH_LAW_REFS_ENABLED:false}

# ===== LLM 근거답변(공급자: 네이버 HyperCLOVA X) =====
# 기본 OFF 게이트. API 키를 주입하고 검증한 뒤 켠다.
# 키는 환경변수 CLOVA_STUDIO_API_KEY 로만 주입하고 이 파일에 원문을 넣지 않는다.
prafta.ai.llm.enabled=${AI_LLM_ENABLED:false}
prafta.ai.llm.host=${AI_LLM_HOST:https://clovastudio.stream.ntruss.com}
prafta.ai.llm.model=${AI_LLM_MODEL:HCX-005}
prafta.ai.llm.max-tokens=${AI_LLM_MAX_TOKENS:4096}
prafta.ai.llm.temperature=${AI_LLM_TEMPERATURE:0.2}
prafta.ai.llm.top-p=${AI_LLM_TOP_P:0.8}
prafta.ai.llm.top-k=${AI_LLM_TOP_K:0}
prafta.ai.llm.repetition-penalty=${AI_LLM_REPETITION_PENALTY:1.1}
# 과금 단가(1k 토큰당, KRW). 미설정(0)이면 비용을 0 으로 기록한다.
prafta.ai.llm.cost-per1k-input=${AI_LLM_COST_PER1K_INPUT:0}
prafta.ai.llm.cost-per1k-output=${AI_LLM_COST_PER1K_OUTPUT:0}
prafta.ai.llm.answer-top-k=${AI_LLM_ANSWER_TOP_K:6}

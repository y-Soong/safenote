spring.datasource.url=${DB_URL:jdbc:p6spy:mysql://localhost:3306/prafta?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:dev_prafta}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver

mybatis.configuration.map-underscore-to-camel-case=true

# \uC5C5\uB85C\uB4DC \uD30C\uC77C \uC11C\uBA85 URL \uC758 \uC808\uB300 host.
# \u2605 dev \uC11C\uBC84 \uBAA8\uB4DC: \uBE44\uC6CC \uB454\uB2E4(IP \uD558\uB4DC\uCF54\uB529 \uAE08\uC9C0 = DHCP \uB300\uC751).
#   \uBE44\uC5B4 \uC788\uC73C\uBA74 FileUrlSigner \uAC00 \uC694\uCCAD \uD5E4\uB354 X-Forwarded-Proto/X-Forwarded-Host \uB85C base \uB97C \uACB0\uC815\uD55C\uB2E4.
#   app \uD504\uB860\uD2B8 vite \uD504\uB85D\uC2DC(/prafta)\uAC00 \uC774 \uB450 \uD5E4\uB354\uC5D0 '\uC6D0\uB798 \uC811\uC18D\uD55C https \uD638\uC2A4\uD2B8'(\uC608: https://<PC IP>:8082)\uB97C
#   \uB123\uC5B4 \uC804\uB2EC\uD558\uBBC0\uB85C, \uD30C\uC77C URL \uC774 \uD398\uC774\uC9C0\uC640 \uAC19\uC740 https \uCD9C\uCC98(same-origin)\uAC00 \uB41C\uB2E4.
#   \u2192 \uC571 \uC6F9\uBDF0 mixed-content \uCC28\uB2E8\uC744 \uD53C\uD574 \uC11C\uBA85/\uAD50\uC721\uC790\uB8CC \uC774\uBBF8\uC9C0\uAC00 \uC778\uB77C\uC778 \uB80C\uB354\uB418\uACE0,
#     PC IP \uAC00 \uBC14\uB00C\uC5B4\uB3C4(\uC811\uC18D Host \uAC00 \uADF8\uB300\uB85C \uBC18\uC601\uB418\uBBC0\uB85C) \uC774 \uAC12\uC744 \uACE0\uCE60 \uD544\uC694\uAC00 \uC5C6\uB2E4.
#   (release APK \uB294 X-Forwarded \uAC00 \uC5C6\uC5B4 \uC694\uCCAD Host=APP_BASE_URL host \uB85C \uD3F4\uBC31 \u2192 http://<IP>:8080, mixed-content \uC5C6\uC74C.)
# \uC6B4\uC601(reverse proxy) \uD658\uACBD\uC5D0\uC11C\uB294 \uD658\uACBD\uBCC0\uC218 FILE_PUBLIC_BASE_URL \uB85C \uACF5\uAC1C host \uB97C \uACE0\uC815\uD55C\uB2E4.
file.public-base-url=${FILE_PUBLIC_BASE_URL:}

# \uD50C\uB7AB\uD3FC \uC6B4\uC601\uC790(/platformApi/**) IP \uD5C8\uC6A9\uBAA9\uB85D(\uCF64\uB9C8\uAD6C\uBD84). \uC2E0\uADDC \uACE0\uAC1D\uC0AC \uC0DD\uC131\u00B7\uAE00\uB85C\uBC8C \uC57D\uAD00 \uAD00\uB9AC \uB4F1 \uCD08\uACE0\uAD8C\uD55C \uACBD\uACC4.
#   - \uBE44\uC6CC \uB450\uBA74 IP \uAC80\uC0AC \uC0DD\uB7B5(\uAC1C\uBC1C \uD3B8\uC758). \u2605 \uC6B4\uC601\uC5D0\uC11C\uB294 \uBC18\uB4DC\uC2DC \uD658\uACBD\uBCC0\uC218 PLATFORM_ALLOWED_IPS \uB85C \uC0AC\uBB34\uC2E4/VPN IP \uB97C \uC9C0\uC815.
#   - \uC6B4\uC601\uC790 \uC778\uAC00(JWT \uD68C\uC0AC\uCF54\uB4DC = prafta_system_admin)\uB294 IP \uC124\uC815\uACFC \uBB34\uAD00\uD558\uAC8C \uD56D\uC0C1 \uAC15\uC81C\uB41C\uB2E4.
prafta.platform.allowed-ips=${PLATFORM_ALLOWED_IPS:}

# \uCD5C\uCD08 \uD50C\uB7AB\uD3FC \uC6B4\uC601\uC790 \uBD80\uD2B8\uC2A4\uD2B8\uB7A9(A\uC548: 1\uD68C\uC6A9 \uD50C\uB798\uADF8). \uAE30\uBCF8 \uBE44\uD65C\uC131.
#   - true \uB85C \uCF1C\uACE0 \uC6B4\uC601\uC790 \uC815\uBCF4(\uC544\uB798 4\uAC1C)\uB97C \uD658\uACBD\uBCC0\uC218\uB85C \uC8FC\uC785 \uD6C4 1\uD68C \uAE30\uB3D9\uD558\uBA74 \uC6B4\uC601\uC790 \uD68C\uC0AC/\uACC4\uC815\uC774 \uBA71\uB4F1 \uC0DD\uC131\uB41C\uB2E4.
#   - \u2605 \uC0DD\uC131 \uC9C1\uD6C4 \uBC18\uB4DC\uC2DC PLATFORM_BOOTSTRAP_ENABLED=false \uB85C \uB418\uB3CC\uB9B4 \uAC83(\uAE30\uB3D9 \uB85C\uADF8\uAC00 \uACBD\uACE0\uB85C \uC548\uB0B4).
#   - \uC774\uBBF8 \uC874\uC7AC\uD558\uBA74 skip(\uBA71\uB4F1). \uD3C9\uBB38 \uBE44\uBC00\uBC88\uD638/\uD734\uB300\uD3F0\uC740 \uB85C\uADF8\uC5D0 \uB0A8\uAE30\uC9C0 \uC54A\uB294\uB2E4.
prafta.platform.bootstrap.enabled=${PLATFORM_BOOTSTRAP_ENABLED:true}
#   \uC6B4\uC601\uC790 \uB85C\uADF8\uC778 ID(\uD544\uC218 \u2014 \uD65C\uC131\uD654 \uC2DC).
prafta.platform.bootstrap.operator-id=${PLATFORM_BOOTSTRAP_OPERATOR_ID:}
#   \uC6B4\uC601\uC790 \uCD08\uAE30 \uBE44\uBC00\uBC88\uD638 \uD3C9\uBB38(\uD544\uC218 \u2014 \uD65C\uC131\uD654 \uC2DC, BCrypt \uD574\uC2DC\uB418\uC5B4 \uC800\uC7A5).
prafta.platform.bootstrap.operator-pw=${PLATFORM_BOOTSTRAP_OPERATOR_PW:}
#   \uC6B4\uC601\uC790 \uC774\uB984(\uD544\uC218 \u2014 \uD65C\uC131\uD654 \uC2DC).
prafta.platform.bootstrap.operator-nm=${PLATFORM_BOOTSTRAP_OPERATOR_NM:}
#   \uC6B4\uC601\uC790 \uD734\uB300\uD3F0\uBC88\uD638(\uD544\uC218 \u2014 \uD65C\uC131\uD654 \uC2DC, AES-GCM \uC554\uD638\uD654 \uC800\uC7A5).
prafta.platform.bootstrap.operator-mbl=${PLATFORM_BOOTSTRAP_OPERATOR_MBL:}

# ===== PRAFTA RAG(AI \uAC80\uC0C9) \u2014 pgvector \uCF54\uD37C\uC2A4 2\uCC28 \uB370\uC774\uD130\uC18C\uC2A4 + TEI \uC784\uBCA0\uB529 =====
# \uB85C\uCEEC \uAE30\uBCF8\uAC12\uC740 \uAC1C\uBC1C \uD3B8\uC758(\uCF54\uD37C\uC2A4 DB/TEI \uBAA8\uB450 localhost). \uC6B4\uC601\uC740 \uD658\uACBD\uBCC0\uC218\uB85C \uC8FC\uC785\uD55C\uB2E4.
# \u203B \uBE44\uBC00\uBC88\uD638(AI_DB_PASSWORD)\uB294 \uC6B4\uC601\uC5D0\uC11C \uBC18\uB4DC\uC2DC \uD658\uACBD\uBCC0\uC218\uB85C\uB9CC \uC8FC\uC785(\uB85C\uCEEC \uAE30\uBCF8\uAC12\uC740 \uAC1C\uBC1C \uD3B8\uC758).
prafta.ai.datasource.url=${AI_DB_URL:jdbc:postgresql://localhost:5432/prafta_ai}
prafta.ai.datasource.username=${AI_DB_USERNAME:prafta}
prafta.ai.datasource.password=${AI_DB_PASSWORD:prafta1234}
prafta.ai.datasource.driver-class-name=org.postgresql.Driver
# TEI \uC784\uBCA0\uB529 \uC11C\uBC84(BGE-m3, 1024\uCC28\uC6D0). \uD638\uCD9C \uC2DC '/embed' \uB97C \uBD99\uC5EC POST \uD55C\uB2E4.
prafta.ai.tei.url=${AI_TEI_URL:http://localhost:8090}
prafta.ai.tei.timeout-ms=${AI_TEI_TIMEOUT:120000}
# \uAC80\uC0C9 topK \uAE30\uBCF8\uAC12/\uC0C1\uD55C(\uC11C\uBE44\uC2A4\uC5D0\uC11C \uD074\uB7A8\uD504).
prafta.ai.search.default-top-k=${AI_SEARCH_DEFAULT_TOPK:5}
prafta.ai.search.max-top-k=${AI_SEARCH_MAX_TOPK:20}
# LLM \uADFC\uAC70\uB2F5\uBCC0(ai01/answer, Phase 2 + \uC704\uD5D8\uC131\uD3C9\uAC00 AI \uB3C4\uCD9C). \uACF5\uAE09\uC790=\uB124\uC774\uBC84 HyperCLOVA X(HCX-005). \u2605\uAE30\uBCF8 OFF \uAC8C\uC774\uD2B8 \u2014 \uD0A4 \uC8FC\uC785+\uAC80\uC99D \uD6C4 ON.
# CLOVA_STUDIO_API_KEY \uB294 ${CLOVA_STUDIO_API_KEY:} \uD50C\uB808\uC774\uC2A4\uD640\uB354\uB85C \uC8FC\uC785(env \uB610\uB294 secrets/platform-bootstrap.properties).
# DB_PASSWORD/JWT_SECRET \uB4F1\uACFC \uB3D9\uC77C \uBC29\uC2DD. \uD0A4 \uC6D0\uBB38\uC740 \uC774 committed properties \uC5D0 \uC808\uB300 \uB123\uC9C0 \uC54A\uB294\uB2E4.
prafta.ai.llm.enabled=${AI_LLM_ENABLED:false}
prafta.ai.llm.host=${AI_LLM_HOST:https://clovastudio.stream.ntruss.com}
prafta.ai.llm.model=${AI_LLM_MODEL:HCX-005}
prafta.ai.llm.max-tokens=${AI_LLM_MAX_TOKENS:4096}
prafta.ai.llm.temperature=${AI_LLM_TEMPERATURE:0.2}
prafta.ai.llm.top-p=${AI_LLM_TOP_P:0.8}
prafta.ai.llm.top-k=${AI_LLM_TOP_K:0}
prafta.ai.llm.repetition-penalty=${AI_LLM_REPETITION_PENALTY:1.1}
# \uACFC\uAE08 \uB2E8\uAC00(1k \uD1A0\uD070\uB2F9, \uACF5\uAE09\uC790 \uD1B5\uD654 KRW). \u2605Naver \uB2E8\uAC00 \uD655\uC815 \uD6C4 \uC124\uC815. \uBBF8\uC124\uC815(0)\uC774\uBA74 COST=0.
prafta.ai.llm.cost-per1k-input=${AI_LLM_COST_PER1K_INPUT:0}
prafta.ai.llm.cost-per1k-output=${AI_LLM_COST_PER1K_OUTPUT:0}
prafta.ai.llm.answer-top-k=${AI_LLM_ANSWER_TOP_K:6}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연차 수동 부여 - Prafta</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --bg-page: #F5F6F7;
    --bg-card: #FFFFFF;
    --bg-secondary: #F3F4F6;
    --bg-tertiary: #FAFBFC;
    --bg-header: #E8F5EE;
    --bg-success: #E8F5EE;
    --bg-info: #EFF6FF;
    --border-default: #E5E7EB;
    --border-strong: #D1D5DB;
    --border-focus: #10B981;
    --text-primary: #1F2937;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --text-info: #1D4ED8;
    --text-danger: #DC2626;
    --color-primary: #10B981;
    --color-primary-hover: #059669;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: var(--bg-page); color: var(--text-primary);
    font-size: 14px; line-height: 1.5; min-height: 100vh;
  }
  .backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal {
    width: 480px; background: var(--bg-card);
    border-radius: var(--radius-lg);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .modal-header {
    padding: 16px 24px; background: var(--bg-header);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .close-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-secondary); padding: 4px;
  }
  .close-btn svg { width: 20px; height: 20px; }
  .modal-body { padding: 24px; }
  .target-card {
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    padding: 10px 14px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar-sm {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-success); color: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 11px;
  }
  .target-name { font-size: 13px; font-weight: 600; }
  .target-info { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 12px; font-weight: 500;
    margin-bottom: 6px; color: var(--text-primary);
  }
  .form-label .required { color: var(--text-danger); margin-left: 2px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 0 10px; font-size: 13px;
    background: white; color: var(--text-primary);
    font-family: inherit;
  }
  .form-input, .form-select { height: 34px; }
  .form-textarea {
    padding: 8px 10px; line-height: 1.5;
    resize: vertical; min-height: 70px;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none; border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
  }
  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 14px;
  }
  .form-grid .form-group { margin-bottom: 0; }
  .input-with-suffix { position: relative; }
  .input-with-suffix .form-input { padding-right: 30px; }
  .suffix-text {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px; color: var(--text-secondary);
    pointer-events: none;
  }
  .info-box {
    display: flex; gap: 8px;
    background: var(--bg-info);
    border-radius: var(--radius-md);
    padding: 10px 12px; margin-bottom: 16px;
  }
  .info-box svg {
    width: 14px; height: 14px;
    color: var(--text-info);
    flex-shrink: 0; margin-top: 2px;
  }
  .info-box-text { font-size: 11px; color: var(--text-info); line-height: 1.5; }
  .modal-footer {
    padding: 16px 24px; border-top: 1px solid var(--border-default);
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .btn {
    height: 32px; padding: 0 16px;
    border-radius: var(--radius-md);
    font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    border: 1px solid var(--border-default);
    background: white; color: var(--text-primary);
  }
  .btn:hover { background: var(--bg-secondary); }
  .btn-primary {
    background: var(--color-primary); color: white;
    border-color: var(--color-primary);
  }
  .btn-primary:hover { background: var(--color-primary-hover); }
</style>
</head>
<body>

<div class="backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">연차 수동 부여</h2>
      <button class="close-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">

      <div class="target-card">
        <div class="avatar-sm">김도</div>
        <div>
          <p class="target-name">김도현</p>
          <p class="target-info">생산팀 / 반장 · 사번 2018-0034</p>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">부여 유형<span class="required">*</span></label>
        <select class="form-select">
          <option>포상휴가 (관리자 수동 부여)</option>
          <option>경조사 휴가</option>
          <option>장기근속 휴가</option>
          <option>기타 약정 휴가</option>
        </select>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">부여 일수<span class="required">*</span></label>
          <div class="input-with-suffix">
            <input class="form-input" type="number" value="2" min="0.5" step="0.5">
            <span class="suffix-text">일</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">사용 가능일<span class="required">*</span></label>
          <input class="form-input" type="date" value="2026-05-19">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">부여 사유</label>
        <textarea class="form-textarea" rows="3" placeholder="예: 2026년 1분기 안전관리 우수상 포상"></textarea>
      </div>

      <div class="info-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <p class="info-box-text">수동 부여한 연차는 부여 이력에 영구 기록되며 감사 추적이 가능합니다. 법정연차와 별도로 관리됩니다.</p>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn">취소</button>
      <button class="btn btn-primary">부여하기</button>
    </div>
  </div>
</div>

</body>
</html>

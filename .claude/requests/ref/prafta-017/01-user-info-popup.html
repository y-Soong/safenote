<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사용자 정보 - Prafta</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --bg-page: #F5F6F7;
    --bg-card: #FFFFFF;
    --bg-secondary: #F3F4F6;
    --bg-tertiary: #FAFBFC;
    --bg-header: #E8F5EE;
    --bg-info: #EFF6FF;
    --bg-warning: #FEF3C7;
    --border-default: #E5E7EB;
    --border-strong: #D1D5DB;
    --border-focus: #10B981;
    --text-primary: #1F2937;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --text-info: #1D4ED8;
    --text-warning: #B45309;
    --text-danger: #DC2626;
    --color-primary: #10B981;
    --color-primary-hover: #059669;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow-y: auto;
  }
  .modal {
    width: 560px; background: var(--bg-card);
    border-radius: var(--radius-lg);
    max-height: calc(100vh - 48px);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .modal-header {
    padding: 16px 24px; background: var(--bg-header);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-default);
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .close-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-secondary); padding: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn svg { width: 20px; height: 20px; }
  .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
  .section { margin-bottom: 20px; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border-default);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title-toggle { display: flex; align-items: center; gap: 8px; }
  .section-sub { font-size: 11px; color: var(--text-tertiary); font-weight: 400; }
  .form-row {
    display: grid; grid-template-columns: 90px 1fr; gap: 12px;
    align-items: center; margin-bottom: 10px;
  }
  .form-row.grid-2 { grid-template-columns: 90px 1fr 90px 1fr; }
  .form-row:last-child { margin-bottom: 0; }
  .form-label { font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .form-input, .form-select {
    height: 32px; border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 0 10px; font-size: 13px;
    background: white; color: var(--text-primary);
    font-family: inherit; width: 100%;
  }
  .form-input:focus, .form-select:focus {
    outline: none; border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
  }
  .form-input-readonly { background: var(--bg-secondary); color: var(--text-secondary); }
  .input-group { display: flex; gap: 6px; width: 100%; }
  .input-group .form-input { flex: 1; }
  .btn-sm {
    height: 32px; padding: 0 12px;
    border-radius: var(--radius-md);
    font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    border: none; background: var(--color-primary); color: white;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-sm:hover { background: var(--color-primary-hover); }
  .btn-sm.btn-warning {
    background: white; color: var(--text-warning);
    border: 1px solid var(--text-warning);
  }
  .btn-sm.btn-warning:hover { background: var(--bg-warning); }
  .btn-sm svg { width: 12px; height: 12px; }
  .hire-date-row {
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    padding: 10px 12px; margin-bottom: 10px;
  }
  .hire-date-row .form-row { margin-bottom: 0; }
  .hire-date-hint {
    grid-column: 2 / -1;
    font-size: 11px; color: var(--text-tertiary); margin-top: 4px;
  }
  .switch {
    position: relative; width: 36px; height: 20px;
    background: var(--border-strong);
    border-radius: 10px; cursor: pointer; flex-shrink: 0;
    transition: background 0.2s;
  }
  .switch.active { background: var(--color-primary); }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: white; border-radius: 50%;
    transition: left 0.2s;
  }
  .switch.active::after { left: 18px; }
  .credit-container {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 12px;
  }
  .credit-item {
    background: white; border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 12px; margin-bottom: 8px;
  }
  .credit-item-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .credit-item-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .icon-btn-sm {
    width: 24px; height: 24px;
    border-radius: var(--radius-sm);
    border: none; background: transparent;
    color: var(--text-tertiary); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn-sm:hover { background: var(--bg-secondary); color: var(--text-danger); }
  .icon-btn-sm svg { width: 14px; height: 14px; }
  .credit-form-grid {
    display: grid; grid-template-columns: 100px 1fr;
    gap: 8px 12px; align-items: center;
    font-size: 12px;
  }
  .credit-form-grid label { color: var(--text-secondary); font-size: 12px; }
  .credit-form-grid .form-input,
  .credit-form-grid .form-select { height: 30px; font-size: 12px; }
  .input-with-suffix { position: relative; }
  .input-with-suffix .form-input { padding-right: 32px; text-align: right; }
  .input-with-suffix .suffix {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px; color: var(--text-tertiary);
    pointer-events: none;
  }
  .add-credit-btn {
    width: 100%; height: 32px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-md);
    background: white; color: var(--text-secondary);
    cursor: pointer; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font-family: inherit;
  }
  .add-credit-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
  .add-credit-btn svg { width: 12px; height: 12px; }
  .credit-summary {
    background: var(--bg-info);
    border-radius: var(--radius-md);
    padding: 10px 12px; margin-top: 10px;
    font-size: 12px; color: var(--text-info);
    display: flex; justify-content: space-between; align-items: center;
  }
  .credit-summary strong { font-weight: 600; }
  .conditional-field {
    display: grid; grid-template-columns: 90px 1fr;
    gap: 12px; align-items: center; margin-bottom: 10px;
  }
  .modal-footer {
    padding: 16px 24px; border-top: 1px solid var(--border-default);
    display: flex; justify-content: flex-end; gap: 8px;
    background: var(--bg-card);
  }
  .btn {
    height: 36px; padding: 0 18px;
    border-radius: var(--radius-md);
    font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    border: 1px solid var(--border-default);
    background: white; color: var(--text-primary);
  }
  .btn:hover { background: var(--bg-secondary); }
  .btn-primary {
    background: var(--color-primary); color: white;
    border-color: var(--color-primary);
  }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-danger {
    background: white; color: var(--text-warning);
    border: 1px solid var(--text-warning);
  }
  .btn-danger:hover { background: var(--bg-warning); }
</style>
</head>
<body>

<div class="backdrop">
  <div class="modal">

    <div class="modal-header">
      <h2 class="modal-title">사용자정보</h2>
      <button class="close-btn" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">

      <!-- 기본 정보 -->
      <div class="section">
        <div class="section-title">기본 정보</div>

        <div class="form-row grid-2">
          <label class="form-label">사용자</label>
          <div class="input-group">
            <input class="form-input" type="text" value="ADMIN" placeholder="ID">
            <input class="form-input" type="text" value="시스템관리자" placeholder="이름">
          </div>
          <label class="form-label"></label>
          <span></span>
        </div>

        <div class="form-row">
          <label class="form-label">권한</label>
          <select class="form-select">
            <option>마스터관리자</option>
            <option>일반사용자</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">휴대폰 번호</label>
          <div class="input-group">
            <input class="form-input" type="tel" value="010-7763-5257">
            <button class="btn-sm">인증요청</button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">인증번호</label>
          <div class="input-group">
            <input class="form-input" type="text" placeholder="인증번호6자리">
            <button class="btn-sm">확인</button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">이메일</label>
          <input class="form-input" type="email" value="test@test.com">
        </div>

        <div class="form-row">
          <label class="form-label">성별</label>
          <select class="form-select">
            <option>남성</option>
            <option>여성</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">사용여부</label>
          <select class="form-select">
            <option>사용</option>
            <option>미사용</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">사업장</label>
          <div class="input-group">
            <input class="form-input" type="text" value="중곡사업장" readonly>
            <button class="btn-sm">찾기</button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">소속부서</label>
          <div class="input-group">
            <input class="form-input" type="text" value="중곡사업장" readonly>
            <button class="btn-sm">찾기</button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">생년월일</label>
          <input class="form-input" type="text" value="930916">
        </div>
      </div>

      <!-- 근태/연차 정보 (신규 섹션) -->
      <div class="section">
        <div class="section-title">
          근태/연차 정보
          <span class="section-sub">신규 추가 영역</span>
        </div>

        <!-- 입사일 (특수 처리) -->
        <div class="hire-date-row">
          <div class="form-row">
            <label class="form-label">입사일</label>
            <div class="input-group">
              <input class="form-input form-input-readonly" type="text" value="2018-03-12" readonly>
              <button class="btn-sm btn-warning" id="hireDateEditBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                입사일 수정
              </button>
            </div>
          </div>
          <div class="hire-date-hint">입사일 변경은 연차 부여 등 노무 계산에 영향을 줍니다. 별도 절차가 필요합니다.</div>
        </div>
      </div>

      <!-- 경력 인정 (토글 가능 영역) -->
      <div class="section">
        <div class="section-title">
          <div class="section-title-toggle">
            <span>경력 인정</span>
            <div class="switch active" id="creditToggle"></div>
          </div>
          <span class="section-sub">M&amp;A, 경력직, 그룹사 이동 등</span>
        </div>

        <div class="credit-container">
          <div class="credit-item">
            <div class="credit-item-header">
              <span class="credit-item-title">인정 항목 #1</span>
              <button class="icon-btn-sm" title="삭제">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
            <div class="credit-form-grid">
              <label>인정 개월</label>
              <div class="input-with-suffix">
                <input class="form-input" type="number" value="60" min="0">
                <span class="suffix">개월</span>
              </div>
              <label>상세 설명</label>
              <input class="form-input" type="text" value="(주)예시기업 인수합병에 따른 5년 경력 인정">
            </div>
          </div>

          <div class="credit-item">
            <div class="credit-item-header">
              <span class="credit-item-title">인정 항목 #2</span>
              <button class="icon-btn-sm" title="삭제">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
            <div class="credit-form-grid">
              <label>인정 개월</label>
              <div class="input-with-suffix">
                <input class="form-input" type="number" value="12" min="0">
                <span class="suffix">개월</span>
              </div>
              <label>상세 설명</label>
              <input class="form-input" type="text" value="핵심 인력 보상안 (1년 추가 인정)">
            </div>
          </div>

          <button class="add-credit-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            인정 항목 추가
          </button>

          <div class="credit-summary">
            <span>총 인정: <strong>72개월 (6년)</strong> · 법적 근속 기준일: <strong>2012.03.12</strong></span>
          </div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-danger">비밀번호 초기화</button>
      <button class="btn btn-primary">저장</button>
    </div>

  </div>
</div>

<script>
  document.getElementById('creditToggle').addEventListener('click', function() {
    this.classList.toggle('active');
  });
</script>

</body>
</html>
